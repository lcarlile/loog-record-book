<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}
#err{position:fixed;inset:0;background:#fff;color:#900;font:14px/1.5 monospace;padding:14px;display:none}</style>
<div id="err"></div>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
const fail = m => { const e=document.getElementById('err'); e.style.display='block'; e.textContent='RENDER ERROR: '+m; };
window.addEventListener('error', e => fail(e.message));
try {
  const THREE = await import('three');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');

  const q = new URLSearchParams(location.search);
  const SIZE = +(q.get('size') || 512);
  const FILE = q.get('file');
  const TINT = q.get('tint');
  const YAW  = +(q.get('yaw')  ?? 22) * Math.PI/180;
  const PITCH= +(q.get('pitch') ?? 14) * Math.PI/180;

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(SIZE, SIZE);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const key  = new THREE.DirectionalLight(0xfff6e6, 3.0); key.position.set(4,6,5);  scene.add(key);
  const fill = new THREE.DirectionalLight(0xd8e6ff, 1.2); fill.position.set(-5,2,3); scene.add(fill);
  const rim  = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(-2,3,-5); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));

  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
  const frame = obj => {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const ctr  = box.getCenter(new THREE.Vector3());
    obj.position.sub(ctr);
    const r = Math.max(size.x, size.y, size.z) * 0.5;
    const d = r / Math.sin(THREE.MathUtils.degToRad(30)/2) * 1.30;
    camera.position.set(Math.sin(YAW)*d*Math.cos(PITCH), Math.sin(PITCH)*d, Math.cos(YAW)*d*Math.cos(PITCH));
    camera.lookAt(0,0,0);
  };
  const tint = (obj,hex) => { if(!hex) return; obj.traverse(n=>{ if(!n.isMesh||!n.material) return;
    (Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{
      if(m.color) m.color.set('#'+hex);
      if('metalness' in m) m.metalness=1; if('roughness' in m) m.roughness=0.26;
      m.map=null; m.needsUpdate=true; }); }); };

  let obj;
  if (FILE) {
    const gltf = await new GLTFLoader().loadAsync(FILE);
    obj = gltf.scene;
  } else {
    obj = new THREE.Mesh(new THREE.TorusKnotGeometry(1,0.32,160,28),
      new THREE.MeshStandardMaterial({color:0xB8862B, metalness:1, roughness:0.24}));
  }
  scene.add(obj); tint(obj, TINT); frame(obj);
  renderer.render(scene, camera);
  document.title = 'READY';
} catch (e) { fail(e && e.message ? e.message : String(e)); }
</script>
